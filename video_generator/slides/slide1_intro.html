<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DealAnchor - Intro Slide</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      background: linear-gradient(135deg, #0B0F19 0%, #111827 50%, #030712 100%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .glow-circle {
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, rgba(245, 158, 11, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    .content {
      z-index: 2;
      text-align: center;
      max-width: 1450px;
      padding: 60px;
    }
    .badge {
      display: inline-block;
      padding: 10px 26px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid #F59E0B;
      color: #FBBF24;
      border-radius: 50px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 104px;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 20px;
      background: linear-gradient(to right, #FFFFFF 0%, #FDE68A 50%, #F59E0B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 {
      font-size: 38px;
      font-weight: 400;
      color: #94A3B8;
      line-height: 1.4;
      margin-bottom: 45px;
    }
    .footer-pill {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 30px;
    }
    .pill-item {
      background: #1E293B;
      border: 1px solid #334155;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 24px;
      color: #E2E8F0;
      font-weight: 500;
    }
    .highlight-blue {
      color: #38BDF8;
      font-weight: 700;
    }
    .highlight-gold {
      color: #FBBF24;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="glow-circle"></div>
  <div class="content">
    <div class="badge">🧠 Persistent Cognitive Memory Layer</div>
    <h1>DealAnchor</h1>
    <h2>Autonomous B2B Client & Deal Memory Co-Pilot<br>Powered by <b>Vectorize Hindsight</b></h2>
    <div class="footer-pill">
      <div class="pill-item">Team: <span class="highlight-gold">Macrosoftware</span></div>
      <div class="pill-item">Presenter: <span class="highlight-blue">Chiranthan H</span></div>
      <div class="pill-item">Memory Engine: <b>Hindsight SDK</b></div>
    </div>
  </div>
</body>
</html>
